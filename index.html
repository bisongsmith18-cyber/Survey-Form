<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <h3>FreeCodeCamp surveyform</h3>
      <i>Thank you for taking the time to help us improve the platform</i>
    </header>
    <main>
      <div class="surveyform">
        <form>
          <div class="eye">
            <label class="fit">Name</label><br />
            <input type="text" placeholder="Enter your Name" /><br /><br />

            <label class="fit">Email</label><br />
            <input type="email" placeholder="Enter your Email" /><br /><br />

            <label class="fit">Age (Optional)</label><br />
            <input type="number" placeholder="Age" /><br /><br />

            <label>Which option best describes your current role?</label><br />
            <select>
              <option value="" disabled selected>select a role</option>
              <option value="st">student</option>
              <option value="ftj">full time job</option>
              <option value="ftl">full time learner</option>
              <option value="pnts">prefer not to say</option>
              <option value="ot">other</option></select
            ><br /><br />
          </div>

          <p>Would you recommend FreeCodeCamp to a friend?</p>
          <input type="radio" id="option1" name="cry" />
          <label for="option1">Definitely</label><br />

          <input type="radio" id="option2" name="cry" />
          <label for="option2">maybe</label><br />

          <input type="radio" id="option3" name="cry" />
          <label for="option3">not sure</label><br /><br />

          <label>What is your favorite feature of FreeCodeCamp?</label><br />
          <select>
            <option value="" disabled selected>select an option</option>
            <option value="ch">Challenges</option>
            <option value="pr">projects</option>
            <option value="cm">community</option>
            <option value="os">
              open
              <source />
            </option>
            <option value="sno">select an option</option></select
          ><br /><br />

          <p>What would you like to see improved? (check all that apply)</p>

          <input type="checkbox" id="front-end-projects" />
          <label for="front end projects">front-end-projects</label><br />

          <input type="checkbox" id="back-end-projects" />
          <label for="back end projects">back-end-projects</label><br />

          <input type="checkbox" id="data-visualisation" />
          <label for="data visualisation">data visualisation</label><br />

          <input type="checkbox" id="challenges" />
          <label for="challenges">challenges</label><br />

          <input type="checkbox" id="open-source-community" />
          <label for="open source community">Open source community</label><br />

          <input type="checkbox" id="gitter-help-rooms" />
          <label for="gitter help rooms">gitter help rooms</label><br />

          <input type="checkbox" id="videos" />
          <label for="videos">videos</label><br />

          <input type="checkbox" id="city-meetups" />
          <label for="city meetups">city meetups</label><br />

          <input type="checkbox" id="wiki" />
          <label for="wiki">wiki</label><br />

          <input type="checkbox" id="forum" />
          <label for="forum">forum</label><br />

          <input type="checkbox" id="additional-courses" />
          <label for="additional courses">additional courses</label><br /><br />

          <p>Any comments or suggestions?</p>

          <textarea
            id="msg"
            name="message"
            placeholder="Enter your comment here..."
          ></textarea
          ><br /><br />

          <button>submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
